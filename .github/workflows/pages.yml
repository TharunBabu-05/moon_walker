name: Publish SELENE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the project
        uses: actions/checkout@v6
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the playable site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css atlas.css _site/
          cp -R src assets vendor _site/
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
