<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">SELENE — From dust to orbit</title>
  <desc id="description">An animated lunar expedition title with a cratered Moon, an orbiting spacecraft, twinkling stars and a rover traversing the surface. Explore, collect, drive and race together.</desc>
  <defs>
    <linearGradient id="space" x2="1" y2="1"><stop stop-color="#080f1b"/><stop offset=".58" stop-color="#111d2c"/><stop offset="1" stop-color="#071018"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9bd8d7" stop-opacity=".2"/><stop offset="1" stop-color="#9bd8d7" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx=".32" cy=".25" r=".85"><stop stop-color="#e4e7e4"/><stop offset=".44" stop-color="#a6aeaf"/><stop offset=".78" stop-color="#69757d"/><stop offset="1" stop-color="#263540"/></radialGradient>
    <radialGradient id="crater"><stop stop-color="#54626a" stop-opacity=".76"/><stop offset=".68" stop-color="#718086" stop-opacity=".35"/><stop offset=".84" stop-color="#e8efea" stop-opacity=".4"/><stop offset="1" stop-color="#9ba7a8" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim"><stop stop-color="#93cece" stop-opacity=".08"/><stop offset=".5" stop-color="#a0d5d2" stop-opacity=".75"/><stop offset="1" stop-color="#93cece" stop-opacity=".08"/></linearGradient>
    <clipPath id="moon-disc"><circle cx="929" cy="190" r="116"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a9ced3" stroke-opacity=".035"/></pattern>
    <g id="wheel"><circle r="9" fill="#08121a" stroke="#c3cbcb" stroke-width="2"/><path d="M-7 0H7M0-7V7M-5-5 5 5M-5 5 5-5" stroke="#899999" stroke-width="1"/></g>
  </defs>
  <style>
    .title{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;letter-spacing:15px;fill:#f0f5f2}
    .text{font-family:'Segoe UI',Arial,sans-serif;fill:#b6c8cf}
    .mono{font-family:Consolas,'Courier New',monospace;letter-spacing:2px;fill:#9db9bd}
    .orbit{transform-origin:929px 190px;animation:orbit 28s linear infinite}
    .star{animation:twinkle 5s ease-in-out infinite alternate}
    .star.slow{animation-duration:8s;animation-delay:-3s}
    .rover{animation:traverse 14s ease-in-out infinite alternate}
    .signal{animation:signal 3s ease-out infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes twinkle{from{opacity:.25}to{opacity:.95}}
    @keyframes traverse{from{transform:translateX(0)}to{transform:translateX(60px)}}
    @keyframes signal{0%{opacity:.7;r:4px}100%{opacity:0;r:17px}}
    @media(prefers-reduced-motion:reduce){.orbit,.star,.rover,.signal{animation:none}}
  </style>
  <rect x="1" y="1" width="1198" height="418" rx="22" fill="url(#space)" stroke="#29414d"/>
  <rect x="13" y="13" width="1174" height="394" rx="15" fill="url(#grid)" stroke="#88c9c8" stroke-opacity=".12"/>
  <ellipse cx="935" cy="193" rx="260" ry="210" fill="url(#glow)"/>
  <g fill="#d9eeef">
    <circle class="star" cx="81" cy="69" r="1.4"/><circle class="star slow" cx="222" cy="52" r="1"/><circle cx="377" cy="78" r="1" opacity=".4"/>
    <circle class="star" cx="561" cy="43" r="1.5"/><circle class="star slow" cx="692" cy="118" r="1.2"/><circle cx="779" cy="48" r="1" opacity=".5"/>
    <circle class="star" cx="1092" cy="83" r="1.6"/><circle class="star slow" cx="1136" cy="226" r="1.3"/><circle cx="1076" cy="302" r="1" opacity=".6"/>
    <circle class="star slow" cx="732" cy="294" r="1.1"/><circle cx="471" cy="301" r="1" opacity=".4"/><circle class="star" cx="114" cy="284" r="1"/>
  </g>
  <g class="mono" font-size="12"><circle cx="62" cy="102" r="3" fill="#afdbcd"/><text x="76" y="106">LUNAR FIELD STUDY / SELENE</text></g>
  <text x="58" y="197" class="title" font-size="80">SELENE</text>
  <path d="M62 220H586" stroke="url(#rim)"/>
  <text x="62" y="258" class="text" font-size="25" fill="#d4e7e4">From dust to orbit.</text>
  <text x="62" y="295" class="text" font-size="15">Leave footprints. Bring back samples. Race your crew.</text>
  <g class="mono" font-size="11" text-anchor="middle">
    <rect x="62" y="321" width="116" height="28" rx="14" fill="#172e37" stroke="#355e65"/><text x="120" y="339">EXPLORE</text>
    <rect x="190" y="321" width="116" height="28" rx="14" fill="#172e37" stroke="#355e65"/><text x="248" y="339">COLLECT</text>
    <rect x="318" y="321" width="116" height="28" rx="14" fill="#172e37" stroke="#355e65"/><text x="376" y="339">DRIVE</text>
    <rect x="446" y="321" width="116" height="28" rx="14" fill="#302c24" stroke="#806c48"/><text x="504" y="339" fill="#e2c58c">RACE</text>
  </g>
  <circle cx="929" cy="190" r="145" fill="none" stroke="#9dcccf" stroke-opacity=".15" stroke-dasharray="3 7"/>
  <circle cx="929" cy="190" r="116" fill="url(#moon)"/>
  <g clip-path="url(#moon-disc)">
    <path d="M814 174Q849 113 893 128T953 96L967 141 933 179 903 185 875 221 832 207Z" fill="#5f6b70" opacity=".34"/>
    <path d="m920 227 39-38 42 16 23 47-29 41-49-17Z" fill="#59686f" opacity=".3"/>
    <g fill="url(#crater)"><circle cx="867" cy="133" r="28"/><circle cx="968" cy="149" r="34"/><circle cx="911" cy="214" r="19"/><circle cx="882" cy="256" r="26"/><circle cx="1008" cy="224" r="20"/><circle cx="938" cy="99" r="14"/><circle cx="940" cy="276" r="16"/><circle cx="840" cy="192" r="13"/></g>
    <path d="M987 70Q920 201 991 310H1060V70Z" fill="#06111a" opacity=".25"/>
  </g>
  <circle cx="929" cy="190" r="116" fill="none" stroke="#e1f0eb" stroke-opacity=".3"/>
  <g class="orbit"><g transform="translate(929 45)"><rect x="-19" y="-4" width="11" height="8" fill="#629aa5" stroke="#add8da" stroke-width=".7"/><rect x="8" y="-4" width="11" height="8" fill="#629aa5" stroke="#add8da" stroke-width=".7"/><path d="M-8 0H8" stroke="#cad6ce"/><rect x="-4" y="-6" width="8" height="12" rx="2" fill="#e1e7df"/><circle r="2" fill="#e3bd71"/></g></g>
  <path d="M695 374Q778 336 848 355T978 350T1187 366V397Q1187 407 1177 407H695Z" fill="#26383f"/>
  <path d="M695 374Q778 336 848 355T978 350T1187 366" fill="none" stroke="#7c9396" stroke-opacity=".6"/>
  <g class="rover"><g transform="translate(838 347)">
    <path d="M-26-9H28L35-3H-30Z" fill="#bda06a"/><path d="M-16-9V-29H12L20-9M-16-29 2-9M12-29-6-9" fill="none" stroke="#c7d6cf" stroke-width="2"/>
    <path d="M-21-5-16 0M24-5 21 0" stroke="#92a8a8" stroke-width="2"/><use href="#wheel" x="-21"/><use href="#wheel" x="24"/>
    <path d="M28-9V-45" stroke="#a2b7b7" stroke-width="1.5"/><circle class="signal" cx="28" cy="-45" r="4" fill="none" stroke="#9fd5d2"/>
    <circle cx="28" cy="-45" r="2" fill="#c5e5da"/>
  </g></g>
  <text x="63" y="387" class="mono" font-size="10">ONE MOON / YOUR EXPEDITION</text>
</svg>
